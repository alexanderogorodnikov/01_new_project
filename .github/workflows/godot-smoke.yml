name: Godot Smoke Test

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        run: |
          curl -sL "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -o /tmp/godot.zip -d "$HOME/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          ln -sf "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" "$HOME/godot/godot"
          "$HOME/godot/godot" --version

      - name: Import project
        run: godot --headless --xr-mode off --path . --import

      - name: Run smoke test
        run: godot --headless --xr-mode off --path . -s res://scripts/tools/smoke_test.gd
